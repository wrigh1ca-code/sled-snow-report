name: Update snow data

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}       # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: update-snow
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch header photo (first run only)
        # Public-domain photo "Open-throttle Riding in Oregon", America's Byways / FHWA:
        # https://fhwaapps.fhwa.dot.gov/bywaysp/photos/73012
        run: |
          if [ ! -f assets/hero.jpg ]; then
            mkdir -p assets
            curl -fsSL -o assets/hero.jpg "https://fhwaapps.fhwa.dot.gov/bywaysp/uploads/asset_files/2145/73012_67a.jpg" || echo "Photo download failed; the illustrated header will show instead."
          fi
      - name: Pull SNOTEL + forecast data
        run: node scripts/update.mjs
      - name: Commit if changed
        run: |
          git config user.name "snow-bot"
          git config user.email "snow-bot@users.noreply.github.com"
          git add data/conditions.json
          [ -f assets/hero.jpg ] && git add assets/hero.jpg
          git diff --cached --quiet || git commit -m "Update snow data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
